version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: alpi_server_1
      APP_PORT: 8080

  server:
    image: satoshiltd/alpi-umbrel:0.4.52
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    ports:
      - 49200:49200
    environment:
      HOME: /data
      ALPI_PLATFORM: umbrel
      ALPI_TTYD_PORT: 8080
      DEVICE_HOSTNAME: $DEVICE_HOSTNAME
      DEVICE_DOMAIN_NAME: $DEVICE_DOMAIN_NAME
    volumes:
      - ${APP_DATA_DIR}/data:/data
