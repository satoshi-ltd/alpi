name: publish

# Release pipeline. Strict chain — every stage gates the next:
#
#   check-version → tests → build → smoke → publish PyPI → tag + GH release
#
# A failing test never produces a wheel. A no-op version (same as
# PyPI's) never builds. A wheel that breaks smoke install never
# reaches users. The "merge → deploy" convention from Cloudflare,
# constrained by PyPI's immutability via the version delta gate.
#
# Why tests live here, not in ``pull-request.yml``: that workflow is the
# PR-feedback workflow. The push-to-main path needs the same
# tests as the gate of the release chain — duplicating them in
# both files would mean a green PR run could still
# slip a red main-branch run into PyPI if they raced. Single
# source of truth on main = this workflow.
#
# Trusted Publisher (OIDC) is configured on PyPI; no API tokens
# live in this repo.

on:
  push:
    branches: [main]
    paths:
      - "alpi/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "CHANGELOG.md"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "publish even if the version already exists on PyPI"
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  # 1. Cheap probe: is the version different from what's on PyPI?
  #    If not, exit early — no tests, no build, no smoke, no publish,
  #    no spam.
  check-version:
    name: should we publish?
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Manual dispatch: only force if explicitly asked to.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "manual force=true — proceeding with version $version"
            exit 0
          fi

          # Auto on push: compare against PyPI's latest.
          live=$(curl -fsS "https://pypi.org/pypi/alpi-agent/json" | python3 -c "import json, sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo "none")
          echo "pyproject=$version  pypi=$live"
          if [ "$version" = "$live" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "version unchanged ($version already on PyPI) — skipping"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "version changed ($live → $version) — will publish"
          fi

  # 2. Test gate. Same suite the dev runs locally (``pytest -q``,
  #    no integration markers — those need real sockets / sandbox
  #    / bwrap and are not part of the dev loop). If a test fails
  #    here the chain stops — no build, no smoke, no publish.
  #    Integration tests live in ``pull-request.yml`` for PRs +
  #    manual dispatch, deliberately not in the release gate so the
  #    publish path matches what the dev validates locally.
  tests:
    name: tests
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # ``test_changelog.py`` walks ``git log`` for version
          # bumps. Default shallow checkout sees one commit, asserts
          # >1 versions, fails. Full history fixes it.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # 3. Build sdist + wheel and validate twine-readability.
  build:
    name: build
    needs: [check-version, tests]
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.11"  # avoid uv resolving to 3.14 (no py-rust-stemmers wheel yet)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.11"
      - run: |
          rm -rf dist/
          uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # 4. Smoke-install in clean containers BEFORE publishing. If a
  #    runtime dep is missing or the entry point breaks, we want to
  #    fail here, not on a user's machine after the wheel is live.
  smoke:
    name: smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image:
          - "python:3.10-slim"
          - "python:3.11-slim"
          - "python:3.12-slim"
          - "ubuntu:22.04"
          - "debian:12"
    container:
      image: ${{ matrix.image }}
    env:
      UV_PYTHON_PREFERENCE: "only-system"  # use the container's Python, not uv-managed 3.14
      UV_PYTHON_DOWNLOADS: "never"
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: bootstrap curl + system python for the uv installer
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl ca-certificates python3 python3-venv

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install alpi from local wheel
        # Glob is permissive — the wheel filename uses PEP 503's
        # normalized form (``alpi_agent-…`` with underscore), not the
        # distribution name from pyproject (``alpi-agent``).
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install ./dist/*.whl

      - name: alpi --version returns the right number
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          out=$(alpi --version)
          echo "$out"
          echo "$out" | grep -q "${{ needs.check-version.outputs.version }}" || {
            echo "version mismatch: expected ${{ needs.check-version.outputs.version }}"
            exit 1
          }

      - name: alpi --help opens
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          alpi --help > /dev/null

  # 5. Real publish — auto on push to main when version changed,
  #    or manual dispatch with force=true. No environment gate
  #    (Cloudflare-style: merge = deploy). Tag + GitHub release
  #    are created post-publish from the same commit.
  publish-pypi:
    name: publish to PyPI
    needs: [check-version, smoke]
    if: |
      (github.event_name == 'push' && needs.check-version.outputs.should_publish == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.force == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for trusted publishing
      contents: write   # to create the tag + GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Tag the commit we just published so users can map a PyPI
      # version back to a git revision. Skip if the tag already
      # exists (manual re-runs after a partial failure).
      - name: tag commit
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists — skipping"
          else
            git tag -a "v$VERSION" -m "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: extract changelog excerpt
        id: changelog
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          {
            echo "body<<__EOF__"
            awk -v v="$VERSION" '
              $0 ~ "^## v"v" " {flag=1; next}
              flag && /^## v[0-9]/ {flag=0}
              flag {print}
            ' CHANGELOG.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: false

  # Site rebuild + deploy is owned by publish-site.yml, which fires on
  # workflow_run when this workflow completes successfully on main.
