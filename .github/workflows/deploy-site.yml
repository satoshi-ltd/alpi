name: deploy-site

# Direct-upload only after repo checks and release contracts pass.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "QUICKSTART.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "pyproject.toml"
      - "alpi/__init__.py"
      - "desktop/package.json"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/src-tauri/Cargo.toml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  integration:
    name: integration
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install -e ".[dev]"
      - run: pytest --integration -q

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - run: |
          rm -rf dist/
          uv build
      - run: uvx twine check dist/*

  site-build:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node site/scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  release-contract:
    name: release contract
    needs: [unit, integration, package]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: wait for published versions referenced by the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMEOUT_SECONDS: "2700"
          INTERVAL_SECONDS: "30"
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile
          import time
          import tomllib
          import urllib.error
          import urllib.request

          root = pathlib.Path.cwd()
          cli_version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          desktop_version = json.loads(
              (root / "desktop/src-tauri/tauri.conf.json").read_text()
          )["version"]
          deadline = time.monotonic() + int(os.environ["TIMEOUT_SECONDS"])
          interval = int(os.environ["INTERVAL_SECONDS"])
          pypi_url = "https://pypi.org/pypi/alpi-agent/json"

          def pypi_has(version):
              try:
                  with urllib.request.urlopen(pypi_url, timeout=20) as response:
                      payload = json.load(response)
              except (OSError, urllib.error.URLError, json.JSONDecodeError) as exc:
                  return False, f"PyPI probe failed: {exc}"
              if version in payload.get("releases", {}):
                  return True, f"PyPI has alpi-agent {version}"
              live = payload.get("info", {}).get("version", "unknown")
              return False, f"PyPI latest is {live}; waiting for {version}"

          def github_release_exists(tag):
              proc = subprocess.run(
                  ["gh", "release", "view", tag, "--json", "tagName"],
                  cwd=root,
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if proc.returncode == 0:
                  return True, f"GitHub release {tag} exists"
              detail = (proc.stderr or proc.stdout).strip()
              return False, f"GitHub release {tag} is not ready: {detail}"

          def desktop_latest_matches(version):
              with tempfile.TemporaryDirectory() as tmp:
                  proc = subprocess.run(
                      [
                          "gh",
                          "release",
                          "download",
                          "desktop-latest",
                          "--pattern",
                          "desktop-release.json",
                          "--dir",
                          tmp,
                      ],
                      cwd=root,
                      capture_output=True,
                      text=True,
                      check=False,
                  )
                  if proc.returncode != 0:
                      detail = (proc.stderr or proc.stdout).strip()
                      return False, f"desktop-latest probe failed: {detail}"
                  path = pathlib.Path(tmp) / "desktop-release.json"
                  if not path.exists():
                      return False, "desktop-latest has no desktop-release.json"
                  try:
                      payload = json.loads(path.read_text())
                  except json.JSONDecodeError as exc:
                      return False, f"desktop-release.json is invalid: {exc}"
              live = payload.get("version")
              if live == version:
                  return True, f"desktop-latest has desktop {version}"
              return False, f"desktop-latest is {live}; waiting for {version}"

          while True:
              pypi_ok, pypi_msg = pypi_has(cli_version)
              cli_release_ok, cli_release_msg = github_release_exists(f"v{cli_version}")
              desktop_ok, desktop_msg = desktop_latest_matches(desktop_version)
              print(pypi_msg)
              print(cli_release_msg)
              print(desktop_msg)
              if pypi_ok and cli_release_ok and desktop_ok:
                  break
              if time.monotonic() >= deadline:
                  print("release contract did not settle before timeout", file=sys.stderr)
                  sys.exit(1)
              time.sleep(interval)
          PY

  deploy:
    name: deploy
    needs:
      - site-build
      - release-contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - name: verify Cloudflare config
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$PROJECT_NAME" || { echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME is missing"; exit 1; }
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
