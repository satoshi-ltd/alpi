name: test-desktop-windows

# Build-only smoke test for the Windows desktop bundle. Manual dispatch only:
# compiles the NSIS installer on a windows-latest runner and uploads it as a
# downloadable artifact. It does NOT cut a GitHub release and does NOT
# Authenticode-sign the installer (SmartScreen will warn on first run).
#
# Use it to verify the Windows build compiles and the .exe launches on a real
# Windows box before wiring windows-latest into publish-desktop.yml. Trigger
# from the Actions tab → "Run workflow", or: gh workflow run test-desktop-windows.yml

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build windows nsis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      # Signing key is the minisign updater key (same one publish-desktop uses) —
      # tauri.conf has createUpdaterArtifacts:true, which needs it to emit the .sig.
      # This is NOT Windows code signing; the installer is still unsigned.
      - name: build NSIS installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      - name: upload installer
        uses: actions/upload-artifact@v4
        with:
          name: alpi-windows-nsis
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 14
