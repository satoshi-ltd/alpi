name: publish-docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (leave empty to use pyproject.toml version)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          # tag refs only — a branch ref would yield the invalid tag `refs/heads/main`
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ref="${GITHUB_REF#refs/tags/}"
            tag="${ref#v}"
          fi
          if [ -z "$tag" ]; then
            tag=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve image tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            satoshiltd/alpi:${{ steps.image.outputs.tag }}
            satoshiltd/alpi:latest
            ghcr.io/${{ github.repository_owner }}/alpi:${{ steps.image.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/alpi:latest
