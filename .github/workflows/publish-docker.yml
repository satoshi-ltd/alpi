name: publish-docker

# Release pipeline for the Docker image. Chained off the alpi release like
# publish-site: when `publish` (PyPI) completes successfully on main, build +
# push the image for that version. The workflow_run success gate ensures a
# failed release never ships an image. The image builds from local source
# (docker/Dockerfile COPYs alpi/ + pip install .), so it needs no PyPI wheel.
#
#   alpi (CLI) → `vX.Y.Z`         → PyPI + GitHub release   (publish.yml)
#   docker     → `docker-vX.Y.Z`  → Docker Hub + ghcr image (this workflow)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "publish even if docker-v<version> already exists"
        type: boolean
        default: false
  workflow_run:
    workflows: ["publish"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  # Cheap probe: should we publish? Only on a successful parent release that
  # tagged this very revision `v$version` (or a manual run). Skip if
  # `docker-v$version` already tagged on origin — that version's image is
  # already out; force=true overrides on a manual run.
  check-version:
    name: should we publish?
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      # On workflow_run, GITHUB_SHA is the newest commit on main, not the one the parent release tested and published.
      - id: source
        name: resolve the released revision
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$SHA" || { echo "no source revision to publish"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "publishing revision $SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="docker-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject version: $version  implied tag: $tag"

          if [ "$EVENT" = "workflow_run" ]; then
            # A publish run that skipped releasing still ends green; only the commit its v-tag names was released.
            released=$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)
            [ -n "$released" ] || released=$(git ls-remote origin "refs/tags/v$version" | cut -f1)
            if [ "$released" != "$SHA" ]; then
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "v$version was released from ${released:-no commit}, not $SHA — nothing to publish"
              exit 0
            fi
          elif [ "$FORCE" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "manual force=true — proceeding"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "tag $tag already exists on origin — skipping"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "tag $tag is new — will publish"
          fi

  docker:
    name: build + push image
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the docker-v<version> tag
      packages: write   # push to ghcr
    env:
      SHA: ${{ needs.check-version.outputs.sha }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.sha }}

      - name: source is the released revision
        run: |
          head=$(git rev-parse HEAD)
          test "$head" = "$SHA" || { echo "checked out $head, releasing $SHA"; exit 1; }
          found=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          test "$found" = "$VERSION" || { echo "pyproject says $found, releasing $VERSION"; exit 1; }

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No Python test can prove the image's Chromium libraries are there: `pip install .` ignores uv.lock, so the image's playwright outruns the suite's. Launch the real browser in the real image instead, before anything is pushed.
      - name: build amd64 for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: alpi-smoke:${{ env.VERSION }}

      - name: smoke — the image carries the version being published
        run: |
          found=$(docker run --rm --entrypoint python "alpi-smoke:$VERSION" -c 'import importlib.metadata as m; print(m.version("alpi-agent"))')
          test "$found" = "$VERSION" || { echo "image carries alpi $found, publishing $VERSION"; exit 1; }

      - name: smoke — chromium headless shell must launch
        run: |
          docker run --rm --entrypoint sh "alpi-smoke:$VERSION" -c '
            set -e
            python -c "
          import sys
          from alpi.tools.browser import Browser, missing_chromium_libs
          missing = missing_chromium_libs()
          ok, reason = Browser.check()
          print(\"playwright:\", __import__(\"importlib.metadata\", fromlist=[\"version\"]).version(\"playwright\"))
          print(\"missing libs:\", missing)
          print(\"check:\", ok, reason)
          if missing or not ok:
              sys.exit(\"browser tool is unavailable in the built image\")
          "
            python -m playwright install --only-shell chromium
            test ! -d "$HOME/.cache/ms-playwright"/chromium-* || \
              (echo "--only-shell pulled a full chromium build" && exit 1)
            python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              page = b.new_page()
              page.set_content(\"<h1>alpi smoke</h1>\")
              snap = page.locator(\"body\").aria_snapshot()
              b.close()
          assert \"alpi smoke\" in snap, snap
          print(\"launch OK:\", snap.strip())
          "
          '

      # PID 1 semantics exist only inside a container: prove the init reaps the orphans `docker exec` leaves, forwards SIGTERM and mirrors the daemon's exit code.
      - name: smoke — PID 1 reaps orphans and forwards SIGTERM
        run: |
          docker run -d --name alpi-pid1 "alpi-smoke:$VERSION"
          for _ in $(seq 60); do
            docker exec alpi-pid1 test -f /data/.alpi/service.pid && break
            sleep 1
          done
          docker exec alpi-pid1 sh -c 'sleep 0.2 & exit 0'
          sleep 3
          docker exec alpi-pid1 python -c '
          import os, sys
          title = open("/proc/1/cmdline", "rb").read().split(b"\0")[0].decode()
          zombies = []
          for d in os.listdir("/proc"):
              if not d.isdigit():
                  continue
              try:
                  stat = open(f"/proc/{d}/stat").read()
              except OSError:
                  continue
              if stat[stat.rfind(")") + 2] == "Z":
                  zombies.append(int(d))
          print("pid 1:", title, "zombies:", zombies)
          if title != "alpi (init)" or zombies:
              sys.exit("PID 1 is not reaping the container")
          '
          docker stop -t 60 alpi-pid1
          code=$(docker inspect --format "{{.State.ExitCode}}" alpi-pid1)
          docker logs alpi-pid1 | tail -n 40
          docker rm alpi-pid1
          test "$code" = "0" || { echo "daemon exit code $code did not propagate cleanly"; exit 1; }

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            satoshiltd/alpi:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/alpi:${{ env.VERSION }}

      # Mark this version as published so a later parent run for the same
      # version skips instead of rebuilding an identical image.
      - name: tag commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "docker-v$VERSION" >/dev/null 2>&1; then
            echo "tag docker-v$VERSION already exists — skipping"
          else
            git tag -a "docker-v$VERSION" -m "docker-v$VERSION"
            git push origin "docker-v$VERSION"
          fi

  # Serialized, and always to the newest docker-v tag: a slower run for an older release cannot pull latest backward.
  latest:
    name: point latest at the newest published image
    needs: [check-version, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-docker-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-version.outputs.sha }}

      - id: newest
        name: pick the newest published version
        run: |
          newest=$(git ls-remote --tags origin 'refs/tags/docker-v*' \
            | awk '{print $2}' | grep -v '\^{}$' | sed 's#^refs/tags/docker-v##' \
            | sort -V | tail -n 1)
          test -n "$newest" || { echo "no docker-v tag on origin"; exit 1; }
          echo "version=$newest" >> "$GITHUB_OUTPUT"
          echo "newest published image: $newest"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: move latest
        env:
          NEWEST: ${{ steps.newest.outputs.version }}
          GHCR: ghcr.io/${{ github.repository_owner }}/alpi
        run: |
          docker buildx imagetools create --tag satoshiltd/alpi:latest "satoshiltd/alpi:$NEWEST"
          docker buildx imagetools create --tag "$GHCR:latest" "$GHCR:$NEWEST"
