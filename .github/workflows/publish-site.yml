name: publish-site

# The site reads pyproject.toml (alpi version) and tauri.conf.json
# (desktop version) at build time. Any release that bumps either of
# those needs the site rebuilt so the download links and badges don't
# go stale. workflow_run gates ensure a failed parent release never
# triggers a deploy.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["publish", "publish-desktop"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/publish-site.yml"

permissions: {}

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-build:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # When triggered by a parent workflow, only proceed on success — a
    # failed publish-desktop / publish must not push an inconsistent site.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node site/scripts/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    needs: site-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist
      - name: verify Cloudflare config
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "$API_TOKEN"   || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$PROJECT_NAME" || { echo "::error::CLOUDFLARE_PAGES_PROJECT_NAME is missing"; exit 1; }
      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
