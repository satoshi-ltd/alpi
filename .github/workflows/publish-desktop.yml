name: publish-desktop

# Release pipeline for the Tauri desktop app. Mirrors the alpi (CLI)
# ``publish.yml`` shape — every push to main is a candidate release;
# CI compares ``tauri.conf.json`` against the last ``desktop-v*`` tag
# on origin and either publishes or skips. No manual ``git tag``
# needed.
#
#   alpi (CLI)  → ``vX.Y.Z``         → PyPI + GitHub release
#   desktop app → ``desktop-vX.Y.Z`` → GitHub release only
#
# Trigger:
#   - push to main touching ``desktop/**`` or this workflow.
#   - manual ``workflow_dispatch`` with ``force=true`` to re-publish a
#     version that already has a tag (rare; usually for fixing a botched
#     release).
#
# Two GitHub releases produced from one run:
#   1. ``desktop-vX.Y.Z`` — immutable, version-stamped.
#   2. ``desktop-latest`` — rolling alias the Tauri updater points to.
#      Same assets plus stable aliases the site can link to directly.
#      The tag moves on every publish so these URLs stay stable:
#      ``releases/download/desktop-latest/latest.json``
#      ``releases/download/desktop-latest/alpi-latest.dmg``
#      ``releases/download/desktop-latest/desktop-release.json``
#
# Signing: minisign keypair via ``TAURI_SIGNING_PRIVATE_KEY`` +
# ``TAURI_SIGNING_PRIVATE_KEY_PASSWORD`` repo secrets for updater
# artifacts, plus Apple Developer ID secrets for macOS code signing and
# notarization.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "common/**"
      - ".github/workflows/publish-desktop.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "publish even if the tag already exists"
        type: boolean
        default: false

permissions: {}

jobs:
  # 1. Cheap probe: should we publish at all?
  #    - read version from tauri.conf.json
  #    - skip if ``desktop-v$version`` tag already exists on origin
  #    - manual dispatch with ``force=true`` always proceeds
  #    Plus a secrets-present guard so a missing secret fails the gate
  #    (cheap) instead of ``tauri-action`` 8 minutes into the matrix.
  check-version:
    name: should we publish?
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: gate
        run: |
          version=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version'])")
          tag="desktop-v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "tauri.conf.json version: $version"
          echo "implied tag:             $tag"

          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "manual force=true — proceeding"
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "tag $tag already exists on origin — skipping"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "tag $tag is new — will publish"
          fi

      - name: secrets present
        if: steps.gate.outputs.should_publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name missing — see desktop/RELEASING.md"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "release signing secrets present"

      - name: package.json + Cargo.toml in sync with tauri.conf.json
        if: steps.gate.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          pkg=$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('desktop/package.json').read_text())['version'])")
          cargo=$(grep -E '^version = "' desktop/src-tauri/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "tauri.conf.json: $VERSION"
          echo "package.json:    $pkg"
          echo "Cargo.toml:      $cargo"
          if [ "$pkg" != "$VERSION" ] || [ "$cargo" != "$VERSION" ]; then
            echo "::error::version mismatch across desktop manifests — bump all three"
            exit 1
          fi

      - name: create draft release
        id: draft
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          existing=$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "release $TAG already exists (id=$existing) — reusing"
            release_id=$existing
          else
            response=$(gh api -X POST repos/${{ github.repository }}/releases \
              -f tag_name="$TAG" \
              -f name="$TAG" \
              -f target_commitish="${{ github.sha }}" \
              -f body="See [desktop/CHANGELOG.md](https://github.com/satoshi-ltd/alpi/blob/main/desktop/CHANGELOG.md) for the full changelog." \
              -F draft=true \
              -F prerelease=false)
            release_id=$(echo "$response" | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
            echo "created draft release $TAG (id=$release_id)"
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  # 2. Bundle build for the supported desktop platforms. ``tauri-action``
  #    invokes ``pnpm tauri build`` per OS, signs with the minisign key,
  #    emits ``latest.json`` (the updater manifest), creates the
  #    ``desktop-vX.Y.Z`` GitHub release with the implied tag, and
  #    uploads every artefact to it.
  build:
    name: build (${{ matrix.os }})
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # ``universal-apple-darwin`` is a Tauri build mode, not a
          # rustup target — rustup needs both real targets installed
          # so Tauri can stitch them.
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            args: "--target universal-apple-darwin --bundles app,dmg"
          - os: ubuntu-22.04
            rust_targets: "x86_64-unknown-linux-gnu"
            args: "--bundles appimage,deb"
          - os: windows-latest
            rust_targets: "x86_64-pc-windows-msvc"
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: linux deps (webkit2gtk + appindicator)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          set -euo pipefail
          # libayatana-appindicator3-dev is the maintained drop-in for libappindicator3-dev on 22.04 (the legacy package's postinst can hang in CI).
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: verify Apple certificate secret
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/apple-certificate.p12"
          keychain="$RUNNER_TEMP/apple-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$cert"
          echo "certificate bytes: $(wc -c < "$cert")"
          echo "certificate sha256: $(shasum -a 256 "$cert" | awk '{print $1}')"

          openssl pkcs12 -info -in "$cert" -noout -passin env:APPLE_CERTIFICATE_PASSWORD
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import "$cert" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security find-identity -v -p codesigning "$keychain"

      - name: verify Apple notarization credentials
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # tauri-action v0.6.2 produces an unnotarized DMG silently when these creds are missing/wrong.
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            > "$RUNNER_TEMP/notary-history.txt"
          echo "notarytool auth OK — last submissions:"
          head -20 "$RUNNER_TEMP/notary-history.txt"

      - name: build signed macOS bundle
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.check-version.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: notarize + staple DMG
        if: matrix.os == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # tauri-action v0.6.2 signs but does not auto-notarize; do it explicitly.
          dmg=$(find desktop/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::no DMG produced — Tauri build did not bundle macOS"
            exit 1
          fi
          echo "submitting $dmg to Apple notary"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('$RUNNER_TEMP/notary.json').read_text())['status'])")
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization $status — fetching Apple log"
            submission_id=$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('$RUNNER_TEMP/notary.json').read_text())['id'])")
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"

      - name: re-upload stapled DMG to the release
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          # tauri-action uploaded the pre-staple bytes; without --clobber here, users download a DMG whose hash Apple never registered.
          dmg=$(find desktop/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)
          gh release upload "$TAG" "$dmg" --repo "$REPO" --clobber

      - name: verify Gatekeeper accepts the signed DMG
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          dmg=$(find desktop/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "::error::no DMG produced — Tauri build did not bundle macOS"
            exit 1
          fi
          echo "asserting Gatekeeper on $dmg"
          codesign -dvv "$dmg" 2>&1 | grep -E 'Authority|TeamIdentifier|hardened'
          spctl --assess --type install --verbose "$dmg"

      - name: build Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.check-version.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # NSIS installer is unsigned (no Authenticode cert) — SmartScreen warns on
      # first run. The minisign key still signs the updater artifact.
      - name: build Windows installer
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.check-version.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # 3. Publish the draft release that the matrix uploaded assets to.
  publish-release:
    name: publish release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          # gh release edit --tag is idempotent: works on draft → public AND on already-public; survives re-runs whose check-version output is stale.
          gh release edit "$TAG" \
            --repo "$REPO" \
            --draft=false \
            --prerelease=false
          echo "published $TAG"

  # 4. Roll the ``desktop-latest`` tag onto the same commit and
  #    re-publish the same assets there. The Tauri updater hits
  #    ``releases/download/desktop-latest/latest.json`` and the site
  #    links to ``alpi-latest.dmg`` / ``desktop-release.json`` —
  #    these URLs must always resolve to the most recent release.
  promote-latest:
    name: promote to desktop-latest
    needs: [check-version, build, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: move desktop-latest tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ref API, never `git push`: GITHUB_TOKEN cannot push a ref whose diff touches .github/workflows/** and no grantable `workflows` permission exists.
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if gh api "repos/$REPO/git/ref/tags/desktop-latest" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/desktop-latest" \
              -f sha="$sha" -F force=true
          else
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/desktop-latest" -f sha="$sha"
          fi

      - name: download assets from version release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-version.outputs.tag }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p latest-assets
          gh release download "$TAG" --dir latest-assets
          # The Tauri updater is meaningless without latest.json. Bail
          # before re-publishing if the build matrix didn't produce it.
          if [ ! -f latest-assets/latest.json ]; then
            echo "::error::latest.json missing in $TAG release — updater endpoint will 404. Build matrix likely failed silently."
            ls -la latest-assets/
            exit 1
          fi

          dmg=$(find latest-assets -maxdepth 1 -type f -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::no .dmg found in $TAG release — landing download would 404."
            ls -la latest-assets/
            exit 1
          fi
          cp "$dmg" latest-assets/alpi-latest.dmg

          # Windows is best-effort — don't fail the rolling alias if its build was skipped.
          exe=$(find latest-assets -maxdepth 1 -type f -name '*-setup.exe' | head -1)
          if [ -n "$exe" ]; then
            cp "$exe" latest-assets/alpi-latest-setup.exe
          fi

          python3 - <<'PY'
          import json, os

          version = os.environ["VERSION"]
          base = "https://github.com/satoshi-ltd/alpi/releases/download/desktop-latest"
          downloads = {"macos_dmg": f"{base}/alpi-latest.dmg"}
          if os.path.exists("latest-assets/alpi-latest-setup.exe"):
              downloads["windows_exe"] = f"{base}/alpi-latest-setup.exe"
          payload = {
              "version": version,
              "tag": f"desktop-v{version}",
              "notes_url": "https://github.com/satoshi-ltd/alpi/blob/main/desktop/CHANGELOG.md",
              "release_url": "https://github.com/satoshi-ltd/alpi/releases/tag/desktop-latest",
              "updater_manifest_url": f"{base}/latest.json",
              "downloads": downloads,
          }
          with open("latest-assets/desktop-release.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          PY

      - name: (re)publish desktop-latest with same assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete desktop-latest --yes || true
          gh release create desktop-latest \
            latest-assets/* \
            --title "desktop-latest (rolling)" \
            --notes "Rolling alias for the most recent desktop release. The Tauri updater endpoint in tauri.conf.json points here so the URL stays stable across versions."
