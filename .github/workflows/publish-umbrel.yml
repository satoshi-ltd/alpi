name: publish-umbrel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag (leave empty to use pyproject.toml version)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          fi
          if [ -z "$tag" ]; then
            echo "::error::could not resolve image tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/umbrel/alpi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: satoshiltd/alpi-umbrel:${{ steps.image.outputs.tag }}
