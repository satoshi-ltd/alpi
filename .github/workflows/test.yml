name: tests

# PR feedback + on-demand integration. The push-to-main path runs
# the unit suite as the first stage of ``publish.yml`` (release
# gate). Integration tests live here because they exercise real
# sockets / sandboxes / TCP — the dev does NOT run them on every
# loop, so they are not in the release gate. PR runs surface them
# for code that touches those paths; ``workflow_dispatch`` lets
# them be rehearsed against any branch on demand.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: pip install -e ".[dev]"
      - run: pytest --integration -q
