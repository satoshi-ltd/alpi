name: lab
display_name: Protocol Lab

# No workspace key → defaults to ~/alpi/organizations/lab. The lab produces
# nothing on disk; it exists to exercise the ALP workgroup protocol end-to-end.
# No scaffold, no sync.

models:
  # main = every profile turn model (effort = org default; agent.md reasoning_effort overrides); fast/deep are routing tiers written to every profile.
  main: { model: openrouter/deepseek/deepseek-v4-flash, effort: medium }
  fast: { model: openrouter/deepseek/deepseek-v4-flash, effort: low }
  deep: { model: openrouter/deepseek/deepseek-v4-pro, effort: medium }

budgets:
  daily_default: 1.0
  workgroup: 20.0

agent_voices: {}
common_skills: {}
