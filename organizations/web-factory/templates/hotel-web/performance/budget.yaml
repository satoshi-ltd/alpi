# Performance budget. Atlas owns the numbers; forge wires CI enforcement; lens audits per launch.

lighthouse_mobile:
  performance: 90
  accessibility: 95
  best_practices: 90
  seo: 95

core_web_vitals:
  lcp_ms: 2500          # Largest Contentful Paint, mid-tier mobile
  cls: 0.1              # Cumulative Layout Shift
  inp_ms: 200           # Interaction to Next Paint

bundle:
  total_js_gzip_kb: 200
  total_css_gzip_kb: 50
  per_route_js_gzip_kb: 80

images:
  hero_max_kb: 200          # AVIF / WebP
  gallery_per_image_max_kb: 120
  format: ["webp"]  # apply-assets-manifest emits WebP (q82); preflight gates hero_max_kb
  max_dimension: 1920

fonts:
  weight_count_max: 2
  format: ["woff2"]
  preload_critical: true     # display=swap on non-critical

network:
  third_party_request_max_count: 5
  no_blocking_scripts: true
