hub: mira
members: [scout, muse, quill, lingua, pixel, lens]
name: "site-{slug}"
quorum_timeout_seconds: 180
budget_usd: 50

params:
  slug:
    pattern: "^[a-z0-9][a-z0-9-]{0,63}$"

inputs:
  brief:
    label: "Hotel brief (immutable)"
    dest: brief.md
    required: true
    placeholder: "Paste the raw client brief. It remains the factual source of truth."

briefing: |
  Workgroup for hotel '{slug}'. The project is an independent clone at projects/{slug}/.
  Read brief.md and the cloned project's factory/template-spec.json before authoring.
  The project contract, scripts and schemas in that clone are authoritative.
  Authoring boundary: src/config/site.json, src/content/** (except config.js),
  assets/manifest.yaml and assets/source/**. Do not modify runtime or design files.
  Pipeline: #setup @pixel · #intake @scout · #assets @muse · #content @quill ·
  #translation @lingua · #build @pixel · #qa @lens.
  Working language: post in English unless the hub addresses you in Spanish.
  The hotel's content keeps its own locales — this rule is only about
  workgroup posts.

task: |
  @pixel #task #setup · initialize the cloned hotel project at projects/{slug}.

pipeline: [setup, intake, assets, content, translation, build, qa]
pipeline_steps:
  setup:
    owner: pixel
    next: intake
    task: "initialize the clone and neutralize the demo data"
    gate: { argv: [npm, run, "check:setup"], cwd: "projects/{slug}" }
  intake:
    owner: scout
    next: assets
    task: "produce work/intake.md and src/config/site.json from brief.md"
    gate: { argv: [npm, run, check:config], cwd: "projects/{slug}" }
  assets:
    owner: muse
    next: content
    task: "produce assets/manifest.yaml from the supplied media and the intake, then optimize"
    gate: { argv: [npm, run, assets:optimize], cwd: "projects/{slug}" }
  content:
    owner: quill
    next: translation
    task: "author the source-locale content in src/content/**"
    gate: { argv: [npm, run, check:content], cwd: "projects/{slug}" }
  translation:
    owner: lingua
    next: build
    task: "bring every declared locale to parity with the source content"
    gate: { argv: [npm, run, check:content:all], cwd: "projects/{slug}" }
  build:
    owner: pixel
    next: qa
    task: "build the selected tier and validate the generated dist"
    gate: { argv: [npm, run, check:dist], cwd: "projects/{slug}" }
  qa:
    owner: lens
    task: "audit the built dist and return one QA PASS or QA FAIL verdict"
    gate: { argv: [npm, run, "check:final"], cwd: "projects/{slug}" }

project:
  template_repo: "git@github.com:satoshi-ltd/alpi-mirai-web-factory.git"
  dest: "projects/{slug}"
  seed:
    files:
      work/intake.md: |
        # Intake — {slug}

        Pixel initializes the clone. Scout records the chosen theme, rationale,
        locales, confirmed facts, gaps and enabled sections here.
