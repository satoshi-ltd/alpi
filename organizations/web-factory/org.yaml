name: web-factory
display_name: Web Factory

workspace: ~/git/web-factory

# "all" = every agent is a mutual peer; workgroup rosters add hub↔member edges on top.
peer_edges: all

# the Astro template lives in the git base repo the recipe clones, not a local copy.
workspace_scaffold:
  - projects
  - archive

# each src dir's children are copied (replace mode) into dst every bootstrap.
sync:
  - src: factory
    dst: factory
  - src: library
    dst: library
  - src: tools
    dst: tools

models:
  # main = every profile turn model (effort = org default; agent.md reasoning_effort overrides); fast = delegate/research + engine plumbing; deep = auto-escalation target.
  main: { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: medium }
  fast: { model: openrouter/deepseek/deepseek-v4-flash-0731, effort: low }
  deep: { model: openrouter/deepseek/deepseek-v4-pro, effort: medium }
  # vision is a per-call SKILL (muse/analyze-image → OpenRouter), not a base-model tier; everyone reasons on text.

budgets:
  daily_default: 2.0       # fallback only — every agent.md declares daily_usd
  workgroup: 50.0          # reserved for standing workgroups
  project_workgroup: 50.0  # per-project proj-<slug> pipeline; the recipe sets this (real runs land ~$1-2)

agent_voices:
  mira:   es-ES-ElviraNeural
  scout:  en-GB-MaisieNeural
  pixel:  en-AU-WilliamNeural
  muse:   en-US-EmmaNeural
  quill:  it-IT-ElsaNeural
  lingua: pt-PT-RaquelNeural
  lens:   en-US-DavisNeural

common_skills: {}
