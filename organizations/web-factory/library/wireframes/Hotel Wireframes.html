<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hotel · Wireframes (4 estilos)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Caveat:wght@500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&family=Jost:wght@300;400;500&family=Libre+Franklin:wght@400;500;600;700&family=Lora:wght@400;500;600&family=Playfair+Display:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="120" rx="20" fill="#2c2722"/>
  <rect x="30" y="34" width="26" height="34" rx="2" fill="#9c6a45"/>
  <rect x="64" y="34" width="26" height="34" rx="4" fill="#1f6feb"/>
  <rect x="30" y="72" width="26" height="14" rx="2" fill="#1e3a5f"/>
  <rect x="64" y="72" width="26" height="14" rx="7" fill="#0d8a8a"/>
  <text x="60" y="100" font-family="Georgia, serif" font-size="13" fill="#fbf9f6" text-anchor="middle" letter-spacing="2">HOTEL</text>
</svg>
</template>


<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wireframe-kit.jsx?v=5"></script>
<script type="text/babel" src="pages-core.jsx?v=5"></script>
<script type="text/babel" src="pages-content.jsx?v=5"></script>
<script type="text/babel" src="pages-convert.jsx?v=5"></script>
<script type="text/babel" src="pages-blog.jsx?v=5"></script>
<script type="text/babel" src="pages-mobile.jsx?v=5"></script>

<script type="text/babel" data-presets="react">
const DESK = 900;
const PHONE = 300;

// per-page heights tuned per style (px). Ragged bottoms are fine (flex-start).
const HT = {
  Landing:    { boutique: 2920, budget: 1740, business: 2300, resort: 2600 },
  RoomsList:  { boutique: 1260, budget: 1180, business: 1080, resort: 1180 },
  RoomDetail: { boutique: 1270, budget: 1020, business: 1060, resort: 1140 },
  Amenities:  { boutique: 1280, budget: 1000, business: 1120, resort: 1040 },
  Dining:     { boutique: 1200, budget: 940,  business: 1000, resort: 1120 },
  Gallery:    { boutique: 1270, budget: 800,  business: 940,  resort: 900 },
  Blog:       { boutique: 1220, budget: 1000, business: 1060, resort: 1240 },
  Post:       { boutique: 1280, budget: 1060, business: 1120, resort: 1300 },
  Offers:     { boutique: 1000, budget: 960,  business: 900,  resort: 1100 },
  Booking:    { boutique: 920,  budget: 1060, business: 980,  resort: 1020 },
  Location:   { boutique: 900,  budget: 960,  business: 980,  resort: 1100 },
  About:      { boutique: 1020, budget: 960,  business: 1000, resort: 1200 },
};

// page list: [componentName, key, label]
const PAGES = [
  ['Landing', 'landing', 'Landing'],
  ['RoomsList', 'rooms', 'Rooms · list'],
  ['RoomDetail', 'roomdetail', 'Room detail'],
  ['Amenities', 'amenities', 'Amenities'],
  ['Dining', 'dining', 'Dining'],
  ['Gallery', 'gallery', 'Gallery'],
  ['Blog', 'blog', 'Blog'],
  ['Post', 'post', 'Post · article'],
  ['Offers', 'offers', 'Offers'],
  ['Location', 'location', 'Location & contact'],
  ['About', 'about', 'About'],
];

const STYLE_ORDER = [
  ['boutique', 'Boutique', 'Editorial · serif · mucho aire · reserva discreta'],
  ['budget',   'Budget',   'Denso tipo OTA · buscador y precio arriba · badges'],
  ['business', 'Business', 'Grid limpio · barra utilitaria · ubicación y eficiencia'],
  ['resort',   'Resort',   'Inmersivo · imagen full-bleed · experiencias · radios grandes'],
];

// ── Tokens & Tweaks ────────────────────────────────────────────
// STYLES (in wireframe-kit) is the token source every page reads at render.
// Snapshot it as the immutable base; rebuild window.STYLES each render from the
// overrides. The AI picks ONE template and may override ANY token — the panel
// models exactly that: a template chooser + a full per-template token editor.
const BASE = window.__BASE_STYLES || (window.__BASE_STYLES = JSON.parse(JSON.stringify(window.STYLES)));
const KEYS = ['boutique', 'budget', 'business', 'resort'];
const LABEL = { boutique: 'Boutique', budget: 'Budget', business: 'Business', resort: 'Resort' };

const SERIF = [
  { value: "'Cormorant Garamond', Georgia, serif", label: 'Cormorant (serif)' },
  { value: "'Playfair Display', Georgia, serif", label: 'Playfair (serif)' },
  { value: "'Lora', Georgia, serif", label: 'Lora (serif)' },
];
const SANS = [
  { value: "'Jost', system-ui, sans-serif", label: 'Jost' },
  { value: "'Archivo', system-ui, sans-serif", label: 'Archivo' },
  { value: "'Libre Franklin', system-ui, sans-serif", label: 'Libre Franklin' },
  { value: "'Quicksand', system-ui, sans-serif", label: 'Quicksand (rounded)' },
  { value: "'DM Sans', system-ui, sans-serif", label: 'DM Sans' },
  { value: "'Work Sans', system-ui, sans-serif", label: 'Work Sans' },
];
const HEAD_OPTS = [...SERIF, ...SANS];
const ACCENTS = {
  boutique: ['#9c6a45', '#6f4e34', '#6f7257', '#74566a'],
  budget:   ['#1f6feb', '#1f8a4c', '#e8732a', '#d13b3b'],
  business: ['#1e3a5f', '#2f4858', '#186b6b', '#2b2f36'],
  resort:   ['#0d8a8a', '#1f7fb0', '#e8943a', '#2e8b57'],
};
const ACCENTS2 = {
  boutique: ['#6f4e34', '#9c6a45', '#4a4a4a', '#5b3f55'],
  budget:   ['#1850c4', '#0b63d6', '#0f766e', '#b45309'],
  business: ['#36577e', '#2f4858', '#0e7490', '#374151'],
  resort:   ['#e8943a', '#f0a830', '#e2674e', '#0d8a8a'],
};
const INK_OPTS = ['#2c2722', '#1a1a1a', '#1d242e', '#f0f0f0'];
const PAPER_OPTS = ['#fbf9f6', '#ffffff', '#f7fbfa', '#0c0c0c'];
const FILL_OPTS = ['#ece8e2', '#f0f0f0', '#e2efec', '#1f1f1f'];
const TEMPLATES = [
  { value: 'compare', label: 'Comparar los 4' },
  { value: 'boutique', label: 'Boutique' },
  { value: 'budget', label: 'Budget' },
  { value: 'business', label: 'Business' },
  { value: 'resort', label: 'Resort' },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "template": "compare",
  "showBindings": false,
  "boutique_head": "'Cormorant Garamond', Georgia, serif",
  "boutique_body": "'Jost', system-ui, sans-serif",
  "boutique_accent": "#6f7257",
  "boutique_accent2": "#6f4e34",
  "boutique_ink": "#2c2722",
  "boutique_paper": "#fbf9f6",
  "boutique_fill": "#ece8e2",
  "boutique_radius": 1,
  "budget_head": "'Archivo', system-ui, sans-serif",
  "budget_body": "'Archivo', system-ui, sans-serif",
  "budget_accent": "#1f6feb",
  "budget_accent2": "#1850c4",
  "budget_ink": "#22262b",
  "budget_paper": "#ffffff",
  "budget_fill": "#eef1f5",
  "budget_radius": 1,
  "business_head": "'Libre Franklin', system-ui, sans-serif",
  "business_body": "'Libre Franklin', system-ui, sans-serif",
  "business_accent": "#2f4858",
  "business_accent2": "#36577e",
  "business_ink": "#1d242e",
  "business_paper": "#ffffff",
  "business_fill": "#eceff3",
  "business_radius": 1,
  "resort_head": "'Archivo', system-ui, sans-serif",
  "resort_body": "'Quicksand', system-ui, sans-serif",
  "resort_accent": "#e8943a",
  "resort_accent2": "#e8943a",
  "resort_ink": "#1c2e2c",
  "resort_paper": "#f7fbfa",
  "resort_fill": "#e2efec",
  "resort_radius": 1
}/*EDITMODE-END*/;

const defaultsFor = (sk) =>
  Object.fromEntries(Object.entries(TWEAK_DEFAULTS).filter(([k]) => k.startsWith(sk + '_')));

function applyTokens(t) {
  const out = JSON.parse(JSON.stringify(BASE));
  for (const sk of KEYS) {
    const o = out[sk];
    if (t[sk + '_head']) o.head = t[sk + '_head'];
    if (t[sk + '_body']) o.body = t[sk + '_body'];
    if (t[sk + '_accent']) o.accent = t[sk + '_accent'];
    if (t[sk + '_accent2']) o.accent2 = t[sk + '_accent2'];
    if (t[sk + '_ink']) o.ink = t[sk + '_ink'];
    if (t[sk + '_paper']) o.paper = t[sk + '_paper'];
    if (t[sk + '_fill']) o.fill = t[sk + '_fill'];
    const rs = typeof t[sk + '_radius'] === 'number' ? t[sk + '_radius'] : 1;
    o.radius = Math.round(BASE[sk].radius * rs);
    o.btnRadius = BASE[sk].btnRadius >= 900 ? 999 : Math.round(BASE[sk].btnRadius * rs);
    // derive dependent neutrals so overrides stay self-consistent
    o.accentSoft = `color-mix(in oklab, ${o.accent} 14%, ${o.paper})`;
    o.line = `color-mix(in oklab, ${o.ink} 12%, ${o.paper})`;
    o.muted = `color-mix(in oklab, ${o.ink} 52%, ${o.paper})`;
  }
  window.STYLES = out;
}

function Canvas({ only }) {
  const rows = only ? STYLE_ORDER.filter(([sk]) => sk === only) : STYLE_ORDER;
  return (
    <DesignCanvas minScale={0.06} maxScale={2}>
      {rows.map(([sk, name, vibe]) => (
        <DCSection key={sk} id={sk} title={name} subtitle={vibe}>
          <DCArtboard id={sk + '-landing'} label="Landing" width={DESK} height={HT.Landing[sk]}>
            {React.createElement(window.Landing, { styleKey: sk })}
          </DCArtboard>
          <DCArtboard id={sk + '-landing-m'} label="Landing · mobile" width={PHONE} height={680}>
            {React.createElement(window.LandingMobile, { styleKey: sk })}
          </DCArtboard>
          {PAGES.slice(1).map(([comp, key, label]) => (
            <DCArtboard key={sk + '-' + key} id={sk + '-' + key} label={label}
              width={DESK} height={HT[comp][sk]}>
              {React.createElement(window[comp], { styleKey: sk })}
            </DCArtboard>
          ))}
        </DCSection>
      ))}
    </DesignCanvas>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  applyTokens(t);                         // rebuild tokens before children render
  window.__SHOW_BINDINGS = !!t.showBindings;
  const only = t.template && t.template !== 'compare' ? t.template : null;
  return (
    <>
      <Canvas only={only} key={(only || 'all') + '|' + (t.showBindings ? 'b' : 'n')} />
      <TweaksPanel title="Plantilla & tokens">
        <TweakSection label="Plantilla — la elige la IA" />
        <TweakSelect label="Template" value={t.template} options={TEMPLATES}
          onChange={(v) => setTweak('template', v)} />
        <TweakToggle label="Mostrar bindings de contenido" value={!!t.showBindings}
          onChange={(v) => setTweak('showBindings', v)} />

        {!only && STYLE_ORDER.map(([sk, name]) => (
          <React.Fragment key={sk}>
            <TweakSection label={name} />
            <TweakColor label="Accent" value={t[sk + '_accent']} options={ACCENTS[sk]}
              onChange={(v) => setTweak(sk + '_accent', v)} />
            <TweakSelect label="Heading font" value={t[sk + '_head']} options={HEAD_OPTS}
              onChange={(v) => setTweak(sk + '_head', v)} />
          </React.Fragment>
        ))}

        {only && (
          <React.Fragment>
            <TweakSection label={'Tokens · ' + LABEL[only]} />
            <TweakSelect label="Heading font" value={t[only + '_head']} options={HEAD_OPTS}
              onChange={(v) => setTweak(only + '_head', v)} />
            <TweakSelect label="Body font" value={t[only + '_body']} options={SANS}
              onChange={(v) => setTweak(only + '_body', v)} />
            <TweakColor label="Accent" value={t[only + '_accent']} options={ACCENTS[only]}
              onChange={(v) => setTweak(only + '_accent', v)} />
            <TweakColor label="Accent 2" value={t[only + '_accent2']} options={ACCENTS2[only]}
              onChange={(v) => setTweak(only + '_accent2', v)} />
            <TweakColor label="Text · ink" value={t[only + '_ink']} options={INK_OPTS}
              onChange={(v) => setTweak(only + '_ink', v)} />
            <TweakColor label="Background" value={t[only + '_paper']} options={PAPER_OPTS}
              onChange={(v) => setTweak(only + '_paper', v)} />
            <TweakColor label="Surface" value={t[only + '_fill']} options={FILL_OPTS}
              onChange={(v) => setTweak(only + '_fill', v)} />
            <TweakSlider label="Corner radius" value={t[only + '_radius']} min={0} max={2} step={0.25} unit="×"
              onChange={(v) => setTweak(only + '_radius', v)} />
            <TweakButton label={'↺ Reset a ' + LABEL[only]} secondary
              onClick={() => setTweak(defaultsFor(only))} />
          </React.Fragment>
        )}
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
