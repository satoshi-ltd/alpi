[project]
# PyPI distribution name. The CLI binary, the import path, and
# ``~/.alpi/`` all remain ``alpi`` (see ``[project.scripts]`` below).
name = "alpi-agent"
version = "0.2.94"
description = "A profile-based personal AI agent for terminal, messengers, and private ALP networks"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX license expression. The full text lives in LICENSE.
license = "BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Satoshi Ltd." }]
keywords = [
    "agent", "ai", "cli", "llm", "personal-agent",
    "privacy", "agent-to-agent", "telegram", "imap",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.50.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "html2text>=2024.2.26",
    "textual>=0.86.0",
    "ddgs>=9.0.0",
    "croniter>=2.0.0",
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "pillow>=10.0",
    "edge-tts>=7.0",
    "faster-whisper>=1.0",
    "cryptography>=42.0",
    "setproctitle>=1.3",
]

[project.urls]
Homepage = "https://alpi.satoshi.ltd"
Repository = "https://github.com/satoshi-ltd/alpi"
Issues = "https://github.com/satoshi-ltd/alpi/issues"
Changelog = "https://github.com/satoshi-ltd/alpi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# No `gateway` extra — the Telegram / IMAP / Gmail gateways live in core
# and use raw httpx long-poll / smtplib. python-telegram-bot, fastapi,
# and uvicorn used to be listed here for a webhook server that never
# shipped; dropped in v0.2.66 after a dependency audit confirmed zero
# imports. If a FastAPI webhook ever lands, add the extra back then.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3.0", "pip-audit>=2.7"]

[project.scripts]
alpi = "alpi.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alpi*"]

[tool.setuptools.package-data]
alpi = ["prompts/*.md", "tui/*.tcss", "skills/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Manual integration scripts under ``tests/manual/`` are runnable
# Python files but NOT collected by pytest — they need live profiles,
# real LLM calls, and explicit setup. Documented in
# ``tests/manual/README.md``.
norecursedirs = ["manual"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = [
    "llm: test makes real LLM calls; requires --llm or ALPI_LLM=1",
]
